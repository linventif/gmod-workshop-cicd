name: 'GMod Workshop Uploader'
description: 'Builds a .gma from your addon folder and publishes it to the Garry’s Mod Steam Workshop via SteamCMD.'
author: 'linventif'

inputs:
  steam_user:
    description: 'Steam login username'
    required: true

  steam_pass:
    description: 'Steam login password'
    required: true

  steam_shared_secret:
    description: 'Shared secret for automatic Steam Guard generation; required unless steam_guard is set'
    required: false

  steam_guard:
    description: 'Manual Steam Guard code; takes precedence over steam_shared_secret'
    required: false

  published_file_id:
    description: 'Workshop item ID (0 to create a new item)'
    required: false
    default: '0'

  content_path:
    description: 'Addon directory in the GitHub workspace (e.g. example_addon); existing addon.json is preserved'
    required: true

  preview_file:
    description: 'Preview image path; required for creation, optional for updates'
    required: false

  title:
    description: 'Workshop item title'
    required: true

  description:
    description: 'Workshop item description'
    required: true

  visibility:
    description: '0=public, 1=friends, 2=private'
    required: false
    default: '0'

  change_note:
    description: 'Changenote for this update (optional)'
    required: false

  dry_run:
    description: 'Build and validate without connecting to Steam'
    required: false
    default: 'false'

outputs:
  published_file_id:
    description: 'Workshop item ID confirmed by SteamCMD'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/linventif/gmod-workshop-cicd:latest'
  env:
    STEAM_USER: ${{ inputs.steam_user }}
    STEAM_PASS: ${{ inputs.steam_pass }}
    STEAM_SHARED_SECRET: ${{ inputs.steam_shared_secret }}
    STEAM_GUARD: ${{ inputs.steam_guard }}
    PUBLISHED_FILE_ID: ${{ inputs.published_file_id }}
    CONTENT_PATH: ${{ inputs.content_path }}
    PREVIEW_FILE: ${{ inputs.preview_file }}
    TITLE: ${{ inputs.title }}
    DESCRIPTION: ${{ inputs.description }}
    VISIBILITY: ${{ inputs.visibility }}
    CHANGE_NOTE: ${{ inputs.change_note }}
    DRY_RUN: ${{ inputs.dry_run }}

branding:
  icon: 'upload'
  color: 'blue'
